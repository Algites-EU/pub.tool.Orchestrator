[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "algites-orchestrator"
version = "0.1.0"
description = "Algites Orchestrator"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18",
  "referencing>=0.30",
]

[project.scripts]
algites-orchestrator = "orchestrator.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["orchestrator*"]

[tool.setuptools.package-data]
"orchestrator.deployment" = ["model/*.yml"]
