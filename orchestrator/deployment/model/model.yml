model_version: 1

description: >
  Registry of the YAML/JSON Schema documents that define version 1 of the
  Algites Orchestrator deployment model. The model version intentionally remains
  1 throughout initial development and will only be incremented after a released
  model requires a compatibility-breaking successor.

schemas:
  common: common.schema.yml
  deployment_environment_configuration: deployment-environment-configuration.schema.yml
  host_configuration: host-configuration.schema.yml
  guest_configuration: guest-configuration.schema.yml
  shared_mountable_resource_configuration: shared-mountable-resource-configuration.schema.yml
  guest_deployment_configuration: guest-deployment-configuration.schema.yml
  deployment_plan: deployment-plan.schema.yml
  deployment_bundle_manifest: deployment-bundle-manifest.schema.yml

xml_schemas:
  common: common.xsd
  deployment_environment_configuration: deployment-environment-configuration.xsd
  host_configuration: host-configuration.xsd
  guest_configuration: guest-configuration.xsd
  shared_mountable_resource_configuration: shared-mountable-resource-configuration.xsd
  guest_deployment_configuration: guest-deployment-configuration.xsd
  deployment_plan: deployment-plan.xsd
  deployment_bundle_manifest: deployment-bundle-manifest.xsd
  validation_report: validation-report.xsd
