$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://algites.eu/orchestrator/deployment/model/v1/guest-configuration.schema.yml"
title: "Algites Orchestrator GuestConfiguration"
description: >
  Defines what a reusable guest type requires in order to operate. It does not
  contain host paths, host storage targets, IP addresses or normal deployment
  sizing. Operating-system implementation files are package attachments selected by os.type;
  packages and services remain authoritative in those implementation files rather than YAML.

type: object
additionalProperties: false
required: [model_version, guest, os, compute, network_interfaces, mountable_resources]
properties:
  model_version:
    const: 1
    description: Version of the Algites Orchestrator deployment model.
  guest:
    type: object
    additionalProperties: false
    required: [id, display_name, description, config_version, config_version_state]
    properties:
      id: {$ref: "common.schema.yml#/$defs/Identifier"}
      display_name: {$ref: "common.schema.yml#/$defs/DisplayName"}
      description: {$ref: "common.schema.yml#/$defs/Description"}
      config_version:
        $ref: common.schema.yml#/$defs/ConfigVersion
        description: Version identifier of this configuration entity definition.
      config_version_state:
        $ref: common.schema.yml#/$defs/ConfigVersionState
        description: User-defined lifecycle state of this configuration version.
  os:
    type: object
    additionalProperties: false
    required: [type]
    properties:
      type:
        $ref: "common.schema.yml#/$defs/OperatingSystemType"
        description: >
          Guest operating system. The corresponding lowercase implementation
          directory (for example nixos/ or debian/) is a framework convention
          inside this versioned GuestConfiguration package.
  compute:
    type: object
    additionalProperties: false
    required: [description]
    properties:
      description: {$ref: "common.schema.yml#/$defs/Description"}
      cpu:
        type: object
        additionalProperties: false
        properties:
          minimum:
            type: integer
            minimum: 1
            description: Hard minimum virtual CPU count.
          default:
            type: integer
            minimum: 1
            description: Default virtual CPU count when deployment does not override it.
      memory: {$ref: "common.schema.yml#/$defs/DataSizeConstraint"}
  network_interfaces:
    type: object
    additionalProperties: false
    required: [description, items]
    properties:
      description: {$ref: "common.schema.yml#/$defs/Description"}
      items:
        type: object
        description: >
          Named logical guest adapters. The number of entries is the number of
          distinct logical adapters requested by the guest; each required item
          must be bound to a host network by deployment.
        propertyNames: {$ref: "common.schema.yml#/$defs/Identifier"}
        additionalProperties:
          type: object
          additionalProperties: false
          required: [display_name, description]
          properties:
            display_name: {$ref: "common.schema.yml#/$defs/DisplayName"}
            description: {$ref: "common.schema.yml#/$defs/Description"}
            required:
              type: boolean
              default: true
              description: Whether deployment must provide this logical adapter.
  mountable_resources:
    type: object
    additionalProperties: false
    required: [description, items, relations]
    properties:
      description: {$ref: "common.schema.yml#/$defs/Description"}
      items:
        type: object
        minProperties: 1
        description: Named mountable-resource requirements of the guest.
        propertyNames: {$ref: "common.schema.yml#/$defs/Identifier"}
        additionalProperties: {$ref: "common.schema.yml#/$defs/MountableResource"}
      relations:
        type: array
        description: >
          Relations among mountable resources. Version 1 contains placement
          independence predicates; the tree structure intentionally leaves room
          for other relation families in future model versions.
        items: {$ref: "common.schema.yml#/$defs/MountableResourceRelation"}
  consumed_services:
    $ref: common.schema.yml#/$defs/ServiceConfigurationReferences
    description: Named ServiceConfiguration versions consumed by this entity. Concrete provider selection is a separate 
      deployment-level concern.
  provided_services:
    $ref: common.schema.yml#/$defs/ServiceConfigurationReferences
    description: Named ServiceConfiguration versions provided by this entity. The ServiceConfiguration package supplies 
      common/provider/consumer definition branches.
