$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://algites.eu/orchestrator/deployment/model/v1/deployment-bundle-manifest.schema.yml"
title: "Algites Orchestrator DeploymentBundle Manifest"
description: >
  Manifest stored at the root of a DeploymentBundle. A bundle contains one or
  more independently usable deployment directories, each with one resolved
  DeploymentPlan and the complete Configuration Entity Packages accessed while
  resolving that deployment.

type: object
additionalProperties: false
required: [bundle_version, model_version, deployment_plan_format, deployments]
properties:
  bundle_version:
    const: 1
  model_version:
    const: 1
  deployment_plan_format:
    enum: [yaml, json, xml]
  deployments:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [id, reference, deployment_plan, attachments]
      properties:
        id: { $ref: "common.schema.yml#/$defs/Identifier" }
        reference: { $ref: "common.schema.yml#/$defs/ConfigurationReference" }
        deployment_plan:
          type: string
          minLength: 1
          description: Path relative to deployment-bundle/.
        attachments:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [category, reference, path]
            properties:
              category:
                type: string
                minLength: 1
              reference: { $ref: "common.schema.yml#/$defs/ConfigurationReference" }
              path:
                type: string
                minLength: 1
                description: Configuration Entity Package path relative to deployment-bundle/.
