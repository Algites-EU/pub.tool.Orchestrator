$schema: "https://json-schema.org/draft/2020-12/schema"
$id: "https://algites.eu/orchestrator/deployment/model/v1/deployment-plan.schema.yml"
title: "Algites Orchestrator DeploymentPlan"
description: >
  Fully resolved output of the deployment resolver. Ansible roles and generated
  guest configuration consume this plan instead of re-interpreting original
  Host/Guest/GuestDeployment configuration semantics.

type: object
additionalProperties: false
required:
  - model_version
  - deployment
  - guest
  - host
  - environment
  - resolved_os
  - resolved_compute
  - resolved_network_interfaces
  - resolved_management_endpoint
  - resolved_mountable_resources
  - relation_results
  - warnings
properties:
  model_version:
    const: 1
    description: Version of the Algites Orchestrator deployment model; initial development remains at version 1.
  deployment: { $ref: "common.schema.yml#/$defs/ConfigurationReference" }
  guest: { $ref: "common.schema.yml#/$defs/ConfigurationReference" }
  host: { $ref: "common.schema.yml#/$defs/ConfigurationReference" }
  environment: { $ref: "common.schema.yml#/$defs/ConfigurationReference" }
  resolved_os:
    type: object
    additionalProperties: false
    required: [type]
    properties:
      type: { $ref: "common.schema.yml#/$defs/GuestOsType" }
      configuration_path:
        type: string
        minLength: 1
        description: >
          Path relative to the referenced guest Configuration Entity Package.
          In a DeploymentBundle the same path is resolved below the copied guest package.
  resolved_compute:
    type: object
    additionalProperties: false
    required: [cpu, memory]
    properties:
      cpu: { type: integer, minimum: 1 }
      memory: { $ref: "common.schema.yml#/$defs/DataSize" }
  resolved_network_interfaces:
    type: object
    additionalProperties:
      type: object
      additionalProperties: true
      required: [display_name, description, host_network]
      properties:
        display_name: { $ref: "common.schema.yml#/$defs/DisplayName" }
        description: { $ref: "common.schema.yml#/$defs/Description" }
        host_network: { $ref: "common.schema.yml#/$defs/Identifier" }
  resolved_management_endpoint:
    $ref: "common.schema.yml#/$defs/NetworkServiceEndpoint"
    description: >
      Concrete guest management endpoint resolved from the guest deployment
      interface binding. The execution layer reaches this endpoint through/from
      the deployment host rather than requiring direct control-node routing.
  resolved_mountable_resources:
    type: object
    propertyNames: { $ref: "common.schema.yml#/$defs/Identifier" }
    additionalProperties:
      type: object
      additionalProperties: true
      required:
        - display_name
        - description
        - storage_class
        - purpose
        - representation
        - access
        - sharing
        - mount_point
        - host_storage_target
        - storage_system
        - backend
      properties:
        display_name: { $ref: "common.schema.yml#/$defs/DisplayName" }
        description: { $ref: "common.schema.yml#/$defs/Description" }
        storage_class: { $ref: "common.schema.yml#/$defs/MountableResourceStorageClass" }
        purpose: { $ref: "common.schema.yml#/$defs/MountableResourcePurpose" }
        representation: { $ref: "common.schema.yml#/$defs/MountableResourceRepresentation" }
        access: { $ref: "common.schema.yml#/$defs/MountableResourceAccessMode" }
        sharing: { $ref: "common.schema.yml#/$defs/MountableResourceSharingMode" }
        mount_point: { type: string, minLength: 1 }
        size: { $ref: "common.schema.yml#/$defs/DataSize" }
        host_storage_target: { $ref: "common.schema.yml#/$defs/Identifier" }
        storage_system:
          type: string
          minLength: 1
          description: Resolved storage-system identity; HOST_LOCAL_STORAGE becomes host-specific.
        backend:
          type: object
          additionalProperties: true
          required: [type]
          properties:
            type: { $ref: "common.schema.yml#/$defs/MountableResourceBackendType" }
        interface:
          type: object
          additionalProperties: true
          description: Present for FILESYSTEM resources and normally absent for BLOCK resources.
          properties:
            provider: { $ref: "common.schema.yml#/$defs/Identifier" }
            type: { $ref: "common.schema.yml#/$defs/MountableResourceInterfaceType" }
        shared_mountable_resource: { $ref: "common.schema.yml#/$defs/ConfigurationReference" }
  relation_results:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [display_name, description, mountable_resources, relations, requirement, satisfied]
      properties:
        display_name: { $ref: "common.schema.yml#/$defs/DisplayName" }
        description: { $ref: "common.schema.yml#/$defs/Description" }
        mountable_resources:
          type: array
          minItems: 2
          items: { $ref: "common.schema.yml#/$defs/Identifier" }
        relations:
          type: array
          minItems: 1
          items: { $ref: "common.schema.yml#/$defs/MountableResourceRelationType" }
        requirement: { $ref: "common.schema.yml#/$defs/MountableResourceRelationRequirement" }
        satisfied: { type: boolean }
        message: { type: string }
  warnings:
    type: array
    items: { type: string }
