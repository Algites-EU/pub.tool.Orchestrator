model_version: 1
environment:

  reference: example-environment
  reference_config_version: '1.0'
host:
  id: example-secondary-host
  display_name: Example Secondary Host
  description: >
    Datacenter deployment host demonstrating implicit host-local storage together
    with a persistent external SAN storage system.

  config_version: '1.0'
  config_version_state: RELEASED
os:
  type: DEBIAN
management_endpoint:
  service_binding:
    application_protocol: SSH
    transport_protocol: TCP
    port: 22
  address: 192.0.2.11

storage_devices:
  local-ssd:
    display_name: Local SSD
    description: Local SSD of the secondary host.
    type: PHYSICAL_DISK
    path: /dev/disk/by-id/ata-EXAMPLE_SECONDARY_SSD
  san-lun:
    display_name: SAN Lun
    description: Logical SAN LUN presented to the secondary host.
    type: OTHER
    path: /dev/disk/by-id/scsi-EXAMPLE_SAN_LUN

storage_controllers:
  local-storage-controller:
    display_name: Local Storage Controller
    description: Local storage controller of example-secondary-host.
  san-hba:
    display_name: SAN HBA
    description: Host bus adapter providing access to datacenter-san.

storage_targets:
  local-disposable:
    display_name: Local Disposable
    description: Disposable local SSD target for reproducible guest roots.
    storage_class: DISPOSABLE
    storage_system: HOST_LOCAL_STORAGE
    impacted_devices: [local-ssd]
    impacted_controllers: [local-storage-controller]
    supported_representations:
    - type: BLOCK
      description: Disposable local guest disks.
      supported_backends:
      - type: QCOW2
        description: QCOW2 image directory on local SSD.
        directory: /srv/libvirt/DISPOSABLE/qemu/images
  san-persistent:
    display_name: SAN Persistent
    description: Persistent storage allocated from the shared datacenter SAN.
    storage_class: PERSISTENT
    storage_system: datacenter-san
    impacted_devices: [san-lun]
    impacted_controllers: [san-hba]
    supported_representations:
    - type: BLOCK
      description: SAN-backed persistent block resources.
      supported_backends:
      - type: LVM
        description: LVM volumes created on a SAN-backed VG.
        volume_group: VG_SAN_PERSISTENT
    - type: FILESYSTEM
      description: SAN-backed host directories exported to guests.
      supported_backends:
      - type: DIRECTORY
        description: Directory root on a SAN-backed host filesystem.
        directory: /srv/libvirt/PERSISTENT/share

networks:
  vm:
    display_name: VM
    description: Routed datacenter guest network.
    bridge: virbr-vm
    mode: ROUTED
    subnet: 10.60.0.0/24
    gateway: 10.60.0.1
    ipv6_subnet: fd60::/64
    ipv6_gateway: fd60::1

mountable_resource_interfaces:
  nfs-vm:
    display_name: NFS VM
    description: NFS provider for Linux/NixOS guests.
    type: NFS
    host_network: vm
    server_address: 10.60.0.1
  samba-vm:
    display_name: Samba VM
    description: Samba provider for Windows/macOS guests.
    type: SAMBA
    host_network: vm
    server_address: 10.60.0.1

defaults:
  filesystem_interface_by_guest_os:
    NIXOS: nfs-vm
    DEBIAN: nfs-vm
    LINUX: nfs-vm
    WINDOWS: samba-vm
    MACOS: samba-vm
